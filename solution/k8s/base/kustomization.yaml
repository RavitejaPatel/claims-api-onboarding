# Shared definition of claims-api. Environments never copy these files;
# they only patch the small set of fields listed in docs/engagement.md (section 5).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: claims-api
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: claims
      app.kubernetes.io/managed-by: argocd
    includeTemplates: true

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - poddisruptionbudget.yaml

# Non-secret configuration. The generated name gets a content hash, so a config
# change produces a new ConfigMap and triggers a normal rolling update.
configMapGenerator:
  - name: claims-api-config
    literals:
      - LOG_LEVEL=info
      - PUBLIC_MODE=false
