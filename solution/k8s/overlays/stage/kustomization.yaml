# stage overlay. Only the fields approved in docs/engagement.md (section 5) may change here;
# tests/ fails the build if dev and stage differ in anything else.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: claims-api-stage

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: stage
    includeTemplates: true

# Immutable image. Updated by the delivery pipeline through a pull request, never by hand.
# The digest is a synthetic placeholder: registry.example.invalid does not exist.
images:
  - name: registry.example.invalid/claims-api
    digest: sha256:3f5a1c0e9b7d2a4f6e8c0b1d3a5f7e9c2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a

replicas:
  - name: claims-api
    count: 2

configMapGenerator:
  - name: claims-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - PUBLIC_MODE=false

patches:
  - target:
      kind: Ingress
      name: claims-api
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: claims-api.stage.apps.example.invalid
      - op: replace
        path: /spec/rules/0/host
        value: claims-api.stage.apps.example.invalid
  - target:
      kind: NetworkPolicy
      name: claims-api
    patch: |-
      # Placeholder documentation address; the platform team supplies the real one (Q3).
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 192.0.2.20/32
