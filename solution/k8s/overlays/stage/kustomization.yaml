# stage overlay. Only the fields approved in docs/engagement.md (section 5) may change here;
# tests/ fails the build if dev and stage differ in anything else.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: claims-api-stage

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: stage
    includeTemplates: true

# Immutable image. Updated by the delivery pipeline through a pull request, never by hand.
# Synthetic placeholder: registry.example.invalid does not exist. The digest is the sha256
# of the text "claims-api synthetic placeholder image 1.0.0" so anyone can reproduce it.
# In real use, CI writes the digest the registry returned for the pushed image.
images:
  - name: registry.example.invalid/claims-api
    digest: sha256:8f89a1200b50804542f1ec133c701693731a28375e1c72cc6d25c50c288eedd1

replicas:
  - name: claims-api
    count: 2

configMapGenerator:
  - name: claims-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - PUBLIC_MODE=false

patches:
  - target:
      kind: Ingress
      name: claims-api
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: claims-api.stage.apps.example.invalid
      - op: replace
        path: /spec/rules/0/host
        value: claims-api.stage.apps.example.invalid
  - target:
      kind: NetworkPolicy
      name: claims-api
    patch: |-
      # Placeholder documentation address; the platform team supplies the real one (Q3).
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 192.0.2.20/32
